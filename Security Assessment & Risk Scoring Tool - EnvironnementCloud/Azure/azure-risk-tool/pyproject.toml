[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-risk-tool"
version = "0.1.1"
description = "Azure resource discovery and risk scoring for a Topaz lab"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "topaz-sdk"
]

[project.scripts]
azure-risk-tool = "azure_risk_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
