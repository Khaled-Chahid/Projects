[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-risk-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34,<2"]

[project.scripts]
cloud-risk-tool = "cloud_risk_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
